openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dining
    description: Student dining hall ordering
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /menu:
    get:
      operationId: getMenu
      tags: [dining]
      summary: Get the dining hall menu
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /restaurants:
    get:
      operationId: getRestaurants
      tags: [dining]
      summary: Get the dining hall restaurant list
      responses:
        "200":
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"
  /pickup-slots:
    get:
      operationId: getPickupSlots
      tags: [dining]
      summary: Get pickup slot availability for a date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Pickup time slots and remaining capacity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupSlot"
  /orders:
    post:
      operationId: createOrder
      tags: [dining]
      summary: Place a student pickup order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Pickup slot is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [dining]
      summary: Retrieve a placed order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MenuItem:
      type: object
      required: [id, name, description, price, vegetarian, imageKey, restaurantId, restaurant, category, available]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: [number, "null"] }
        vegetarian: { type: boolean }
        imageKey: { type: string }
        restaurantId: { type: string }
        restaurant: { type: string }
        category: { type: string }
        available: { type: boolean }
    Restaurant:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    PickupSlot:
      type: object
      required: [time, remaining, available]
      properties:
        time: { type: string }
        remaining: { type: integer, minimum: 0, maximum: 5 }
        available: { type: boolean }
    OrderLineInput:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    OrderInput:
      type: object
      required: [studentName, pickupDate, pickupTime, items]
      properties:
        studentName: { type: string, minLength: 1, maxLength: 80 }
        pickupDate: { type: string, format: date }
        pickupTime:
          type: string
          pattern: "^(11:(30|40|50)|12:([0-5]0)|13:([0-2]0|30))$"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineInput"
    OrderLine:
      type: object
      required: [itemId, name, price, quantity]
      properties:
        itemId: { type: string }
        name: { type: string }
        price: { type: number }
        quantity: { type: integer }
    Order:
      type: object
      required: [id, pickupCode, studentName, pickupDate, pickupTime, total, items]
      properties:
        id: { type: integer }
        pickupCode: { type: string }
        studentName: { type: string }
        pickupDate: { type: string, format: date }
        pickupTime: { type: string }
        total: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

