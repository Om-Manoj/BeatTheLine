openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dining
    description: Student dining hall ordering
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /menu:
    get:
      operationId: getMenu
      tags: [dining]
      summary: Get the dining hall menu
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /restaurants:
    get:
      operationId: getRestaurants
      tags: [dining]
      summary: Get the dining hall restaurant list
      responses:
        "200":
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"
  /staff/menu:
    get:
      operationId: getStaffMenu
      tags: [dining]
      summary: Get all restaurant menu items for staff
      security:
        - bearerAuth: []
      parameters:
        - name: X-Prototype-Staff-Access
          in: header
          required: false
          description: Development-only demo access; ignored outside development mode.
          schema:
            type: string
            enum: [demo]
      responses:
        "200":
          description: Menu items including unavailable items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
        "401":
          description: Sign-in required
  /staff/menu/{itemId}:
    patch:
      operationId: updateMenuItem
      tags: [dining]
      summary: Update a restaurant menu item
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: X-Prototype-Staff-Access
          in: header
          required: false
          description: Development-only demo access; ignored outside development mode.
          schema:
            type: string
            enum: [demo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemUpdate"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          description: Invalid menu item
        "401":
          description: Sign-in required
        "404":
          description: Menu item not found
  /staff/restaurants/{restaurantId}/menu:
    post:
      operationId: createMenuItem
      tags: [dining]
      summary: Add an item to a restaurant menu
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
        - name: X-Prototype-Staff-Access
          in: header
          required: false
          description: Development-only demo access; ignored outside development mode.
          schema:
            type: string
            enum: [demo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          description: Invalid menu item
        "401":
          description: Sign-in required
        "404":
          description: Restaurant not found
  /pickup-slots:
    get:
      operationId: getPickupSlots
      tags: [dining]
      summary: Get pickup slot availability for a date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Pickup time slots and remaining capacity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupSlot"
  /orders:
    post:
      operationId: createOrder
      tags: [dining]
      summary: Place a student pickup order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Pickup slot is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{confirmationToken}:
    get:
      operationId: getOrder
      tags: [dining]
      summary: Retrieve a placed order
      parameters:
        - name: confirmationToken
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /staff/orders:
    get:
      operationId: getStaffOrders
      tags: [dining]
      summary: Get active dining orders for signed-in users or development demo access
      security:
        - bearerAuth: []
      parameters:
        - name: X-Prototype-Staff-Access
          in: header
          required: false
          description: Development-only demo access; ignored outside development mode.
          schema:
            type: string
            enum: [demo]
      responses:
        "200":
          description: Active orders in pickup-time order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffOrder"
        "401":
          description: Sign-in required
  /staff/orders/{orderId}/status:
    patch:
      operationId: updateStaffOrderStatus
      tags: [dining]
      summary: Update order preparation status
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
        - name: X-Prototype-Staff-Access
          in: header
          required: false
          description: Development-only demo access; ignored outside development mode.
          schema:
            type: string
            enum: [demo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffOrderStatusUpdate"
      responses:
        "200":
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOrder"
        "401":
          description: Sign-in required
        "404":
          description: Order not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MenuItem:
      type: object
      required: [id, name, description, price, vegetarian, imageKey, restaurantId, restaurant, category, available]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: [number, "null"] }
        vegetarian: { type: boolean }
        imageKey: { type: string }
        restaurantId: { type: string }
        restaurant: { type: string }
        category: { type: string }
        available: { type: boolean }
    MenuItemInput:
      type: object
      required: [name, description, category, price, vegetarian]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 80 }
        price: { type: ["number", "null"], minimum: 0 }
        vegetarian: { type: boolean }
    MenuItemUpdate:
      type: object
      required: [name, description, category, price, vegetarian, available]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 80 }
        price: { type: ["number", "null"], minimum: 0 }
        vegetarian: { type: boolean }
        available: { type: boolean }
    Restaurant:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    PickupSlot:
      type: object
      required: [time, remaining, available]
      properties:
        time: { type: string }
        remaining: { type: integer, minimum: 0, maximum: 5 }
        available: { type: boolean }
    OrderLineInput:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    OrderInput:
      type: object
      required: [studentName, pickupDate, pickupTime, items, mealSwipeCount, balanceAccount]
      properties:
        studentName: { type: string, minLength: 1, maxLength: 80 }
        pickupDate: { type: string, format: date }
        pickupTime:
          type: string
          pattern: "^(11:(30|40|50)|12:([0-5]0)|13:([0-2]0|30))$"
        mealSwipeCount: { type: integer, minimum: 0, maximum: 20 }
        balanceAccount:
          type: string
          enum: [flex_dirhams, campus_dirhams]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineInput"
    PaymentMethod:
      type: string
      enum: [meal_swipe, flex_dirhams, campus_dirhams, meal_swipe_plus_flex, meal_swipe_plus_campus, pay_at_pickup]
    OrderStatus:
      type: string
      enum: [new, preparing, ready, collected]
    StaffOrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [preparing, ready, collected]
    OrderLine:
      type: object
      required: [itemId, name, price, quantity]
      properties:
        itemId: { type: string }
        name: { type: string }
        price: { type: number }
        quantity: { type: integer }
    Order:
      type: object
      required: [id, confirmationToken, pickupCode, studentName, pickupDate, pickupTime, total, items, paymentMethod, mealSwipesUsed, dirhamAmount]
      properties:
        id: { type: integer }
        confirmationToken: { type: string, format: uuid }
        pickupCode: { type: string }
        studentName: { type: string }
        pickupDate: { type: string, format: date }
        pickupTime: { type: string }
        total: { type: number }
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        mealSwipesUsed: { type: integer, minimum: 0 }
        dirhamAmount: { type: number, minimum: 0 }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    StaffOrder:
      type: object
      required: [id, pickupCode, studentName, pickupDate, pickupTime, status, items]
      properties:
        id: { type: integer }
        pickupCode: { type: string }
        studentName: { type: string }
        pickupDate: { type: string, format: date }
        pickupTime: { type: string }
        status:
          $ref: "#/components/schemas/OrderStatus"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

