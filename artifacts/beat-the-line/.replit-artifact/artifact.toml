kind = "mobile"
previewPath = "/"
title = "BeatTheLine"
description = "A university dining pickup app that lets students browse a sample menu, build an order, reserve a 10-minute pickup slot, and pay at pickup."
version = "1.0.0"
id = "artifacts/beat-the-line"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19857

[services.development]
run = "pnpm --filter @workspace/beat-the-line run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beat-the-line", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/beat-the-line", "run", "serve" ]

[services.env]
PORT = "19857"
BASE_PATH = "/"
